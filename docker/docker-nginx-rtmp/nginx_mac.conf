daemon off;
pid /tmp/nginx.pid;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    sendfile off;
    tcp_nopush on;
    server_tokens off;
    access_log /dev/stdout combined;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss;

    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
    }

    upstream lvdou-app {
        server 127.0.0.1:3080;
        keepalive 32;
    }
    server {
        listen 4080;
        root /Users/ton/Desktop/projects/cicy/docker/docker-nginx-rtmp/www/root;
        index        index.html;
        autoindex on;
        autoindex_localtime on;
        autoindex_exact_size on;


        location = /swagger {
            proxy_pass http://lvdou-app/swagger;
        }
        location = /docs {
            proxy_pass http://lvdou-app/docs;
        }

        location = /openapi.json {
            proxy_pass http://lvdou-app/openapi.json;
        }
        location = /auth-validate {
            internal;
            if ($arg_token) {
                set $auth_token $arg_token;
            }

            proxy_pass http://lvdou-app/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
        }

        location /assets/static {
            root /Users/ton/Desktop/projects/cicy/docker/docker-nginx-rtmp/www/data;
        }
        location /assets/preview {
            root /Users/ton/Desktop/projects/cicy/docker/docker-nginx-rtmp/www/data;
        }

        location /assets/thumb {
            root /Users/ton/Desktop/projects/cicy/docker/docker-nginx-rtmp/www/data;
        }

        location /assets/video {
            auth_request /auth-validate;
            root /Users/ton/Desktop/projects/cicy/docker/docker-nginx-rtmp/www/data;
            mp4;
            mp4_buffer_size 1M;
            mp4_max_buffer_size 2M;
            # Enable CORS for video requests
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range';
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
              add_header Access-Control-Allow-Origin *;
              add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
              add_header Access-Control-Allow-Headers 'Range';
              add_header Access-Control-Max-Age 1728000;
              add_header Content-Type 'text/plain; charset=utf-8';
              add_header Content-Length 0;
              return 204;
            }
            # Cache videos for 30 days
            expires 30d;
        }
        location /html {
            root /Users/ton/Desktop/projects/cicy/docker/docker-nginx-rtmp/www/data;
        }


        location /api {

            client_max_body_size 5000M;
            client_body_buffer_size 5000M;
            # Remove trailing slash for proper proxy pass
            proxy_pass http://lvdou-app/api;

            # Essential proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
